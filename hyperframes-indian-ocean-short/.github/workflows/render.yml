name: Render HyperFrames Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg & Headless Chrome Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Lint & Render HyperFrames Composition (1080x1920 @ 60fps)
        run: |
          npx --yes hyperframes lint
          npx --yes hyperframes render --fps 60 --quality high --output indian-ocean-short.mp4

      - name: Upload Rendered MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: indian-ocean-short-mp4
          path: indian-ocean-short.mp4
