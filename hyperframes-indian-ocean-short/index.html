  <style>
    :root {
      --bg-deep: #04241c;
      --bg-ocean: #074736;
      --grid-line: rgba(140, 235, 200, 0.22);
      --gold: #ffe63b;
      --gold-glow: #ffae00;
      --mint-white: #dcfff4;
      --font-display: "Space Grotesk", sans-serif;
      --font-num: "JetBrains Mono", monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--mint-white);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    #main {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #0a4f3c 0%, #052c22 65%, #021712 100%);
      perspective: 1400px;
      isolation: isolate;
    }

    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Persistent 3D perspective studio grid backdrop (visible around map card in tilted views) */
    #bg-grid-stage {
      position: absolute;
      inset: -400px;
      background-color: #04231b;
      background-image:
        linear-gradient(to right, rgba(165, 245, 215, 0.20) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(165, 245, 215, 0.20) 2px, transparent 2px);
      background-size: 130px 130px;
      transform-style: preserve-3d;
      z-index: 1;
    }

    #bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(1, 12, 9, 0.72) 100%);
      z-index: 2;
    }

    /* 3D Camera Rig holding the Satellite World Map Card */
    #camera-viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1350px;
      transform-style: preserve-3d;
      z-index: 5;
    }

    #map-card {
      position: relative;
      width: 1600px;
      height: 893px;
      flex-shrink: 0;
      background: #063e30;
      border: 8px solid rgba(240, 255, 250, 0.92);
      border-radius: 6px;
      box-shadow:
        0 40px 95px rgba(0, 0, 0, 0.78),
        0 0 60px rgba(7, 82, 62, 0.55);
      transform-style: preserve-3d;
      will-change: transform, filter;
      overflow: hidden;
    }

    #world-satellite-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 893px;
      object-fit: cover;
      display: block;
      filter: saturate(1.12) contrast(1.06);
    }

    /* Subtle emerald tint overlay matching original video's deep green ocean grade */
    #ocean-color-grade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 63% 58%, rgba(12, 130, 95, 0.22) 0%, rgba(4, 48, 36, 0.14) 70%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    /* Map-space SVG overlay (1600 x 893 aligned 1:1 with satellite continents) */
    #map-vector-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 893px;
      overflow: visible;
      pointer-events: none;
      z-index: 10;
    }

    /* Scene 1: 3D Extruded "INDIAN OCEAN" Hero Title in Map Space */
    #s1-title-wrap {
      position: absolute;
      left: 1030px;
      top: 525px;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
      width: 560px;
    }

    .s1-word {
      display: flex;
      justify-content: center;
      gap: 4px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 74px;
      line-height: 1.02;
      letter-spacing: 3px;
      color: #dffef4;
      text-shadow:
        0 2px 0 #9bd8c4,
        0 4px 0 #5ea892,
        0 6px 0 #2d6e59,
        0 8px 0 #164436,
        0 14px 24px rgba(0, 0, 0, 0.65);
    }

    .s1-word.line-1 {
      transform: rotate(-3deg);
      margin-bottom: 6px;
    }

    .s1-word.line-2 {
      transform: rotate(-1.5deg);
    }

    .s1-char {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Scene 2: "3rd" + "70.56 Million Sq. Kms" inside Indian Ocean */
    #s2-rank-badge {
      position: absolute;
      left: 1015px;
      top: 545px;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 92px;
      color: var(--gold);
      text-shadow:
        0 0 24px rgba(255, 224, 50, 0.85),
        0 0 48px rgba(255, 170, 0, 0.55),
        0 6px 14px rgba(0, 0, 0, 0.65);
      z-index: 22;
      white-space: nowrap;
    }

    #s2-rank-badge sup {
      font-size: 52px;
      vertical-align: super;
      margin-left: 2px;
    }

    #s2-area-counter-wrap {
      position: absolute;
      left: 1025px;
      top: 548px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 23;
      white-space: nowrap;
    }

    #s2-area-num {
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 82px;
      letter-spacing: -2px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 22px rgba(255, 230, 59, 0.9),
        0 0 45px rgba(255, 166, 0, 0.65),
        0 5px 14px rgba(0, 0, 0, 0.75);
    }

    #s2-area-unit {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 31px;
      line-height: 1.08;
      color: var(--gold);
      text-align: left;
      text-shadow:
        0 0 16px rgba(255, 230, 59, 0.85),
        0 4px 10px rgba(0, 0, 0, 0.75);
    }

    /* Scene 3: "14%" Screen-Space Counter below the 3D tilted world map card */
    #s3-screen-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 1180px;
      z-index: 30;
    }

    #s3-pct-num {
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 168px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      transform: rotate(-8deg);
      text-shadow:
        0 0 32px rgba(255, 230, 59, 0.92),
        0 0 70px rgba(255, 174, 0, 0.6),
        0 10px 24px rgba(0, 0, 0, 0.8);
    }

    /* Scene 4: 7 US Flag Map Cutouts inside the Indian Ocean (Map Space) */
    #s4-usa-layer {
      position: absolute;
      inset: 0;
      z-index: 24;
    }

    .usa-item {
      position: absolute;
      width: 156px;
      height: 98px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.65));
      will-change: transform, opacity, filter;
    }

    /* Scene 5: "1.5x" Counter over Glowing Asia (Map Space) */
    #s5-asia-counter {
      position: absolute;
      left: 1120px;
      top: 255px;
      transform: translate(-50%, -50%);
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 108px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 28px rgba(255, 230, 59, 0.95),
        0 0 64px rgba(255, 166, 0, 0.75),
        0 8px 20px rgba(0, 0, 0, 0.85);
      z-index: 26;
      white-space: nowrap;
    }

    /* Scene 6: Two Photorealistic Moons inside Indian Ocean (Map Space) */
    #s6-moons-layer {
      position: absolute;
      inset: 0;
      z-index: 25;
    }

    .moon-orb {
      position: absolute;
      width: 152px;
      height: 152px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      box-shadow:
        0 18px 32px rgba(0, 0, 0, 0.78),
        0 0 26px rgba(210, 230, 255, 0.28),
        inset -14px -14px 28px rgba(0, 0, 0, 0.55),
        inset 8px 8px 18px rgba(255, 255, 255, 0.25);
      will-change: transform, opacity;
    }

    .moon-orb img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* Subtle film grain (CSS radial-gradient per HyperFrames spec) */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      opacity: 0.14;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1.2px),
        radial-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1.2px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: overlay;
    }
    
  </style>
</head>

  <script>
