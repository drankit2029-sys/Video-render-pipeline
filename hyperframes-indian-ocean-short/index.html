<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Indian Ocean Is Larger Than You Think — HyperFrames 1:1 Composition</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #04241c;
      --bg-ocean: #074736;
      --grid-line: rgba(140, 235, 200, 0.22);
      --gold: #ffe63b;
      --gold-glow: #ffae00;
      --mint-white: #dcfff4;
      --font-display: "Space Grotesk", sans-serif;
      --font-num: "JetBrains Mono", monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--mint-white);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    #main {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #0a4f3c 0%, #052c22 65%, #021712 100%);
      perspective: 1400px;
      isolation: isolate;
    }

    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Persistent 3D perspective studio grid backdrop (visible around map card in tilted views) */
    #bg-grid-stage {
      position: absolute;
      inset: -400px;
      background-color: #04231b;
      background-image:
        linear-gradient(to right, rgba(165, 245, 215, 0.20) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(165, 245, 215, 0.20) 2px, transparent 2px);
      background-size: 130px 130px;
      transform-style: preserve-3d;
      z-index: 1;
    }

    #bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(1, 12, 9, 0.72) 100%);
      z-index: 2;
    }

    /* 3D Camera Rig holding the Satellite World Map Card */
    #camera-viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1350px;
      transform-style: preserve-3d;
      z-index: 5;
    }

    #map-card {
      position: relative;
      /* content-box keeps the 1600x893 content (and the 1600x893 map-space SVG
         overlay) exactly aligned, instead of overflowing the border and hiding
         the right/bottom edges of the card frame. */
      box-sizing: content-box;
      width: 1600px;
      height: 893px;
      flex-shrink: 0;
      background: #063e30;
      border: 8px solid rgba(240, 255, 250, 0.92);
      border-radius: 6px;
      box-shadow:
        0 40px 95px rgba(0, 0, 0, 0.78),
        0 0 60px rgba(7, 82, 62, 0.55);
      transform-style: preserve-3d;
      /* crisp vector re-rasterization on zoom */
      overflow: hidden;
    }

    #world-satellite-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 893px;
      object-fit: cover;
      display: block;
      filter: saturate(1.12) contrast(1.06);
    }

    /* Subtle emerald tint overlay matching original video's deep green ocean grade */
    #ocean-color-grade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 63% 58%, rgba(12, 130, 95, 0.22) 0%, rgba(4, 48, 36, 0.14) 70%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    /* Map-space SVG overlay (1600 x 893 aligned 1:1 with satellite continents) */
    #map-vector-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 893px;
      overflow: visible;
      pointer-events: none;
      z-index: 10;
    }

    /* Scene 1: 3D Extruded "INDIAN OCEAN" Hero Title in Map Space */
    #s1-title-wrap {
      position: absolute;
      left: 1030px;
      top: 525px;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
      width: 560px;
    }

    .s1-word {
      display: flex;
      justify-content: center;
      gap: 4px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 74px;
      line-height: 1.02;
      letter-spacing: 3px;
      color: #dffef4;
      text-shadow:
        0 2px 0 #9bd8c4,
        0 4px 0 #5ea892,
        0 6px 0 #2d6e59,
        0 8px 0 #164436,
        0 14px 24px rgba(0, 0, 0, 0.65);
    }

    .s1-word.line-1 {
      transform: rotate(-3deg);
      margin-bottom: 6px;
    }

    .s1-word.line-2 {
      transform: rotate(-1.5deg);
    }

    .s1-char {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Scene 2: "3rd" + "70.56 Million Sq. Kms" inside Indian Ocean */
    #s2-rank-badge {
      position: absolute;
      left: 1015px;
      top: 545px;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 92px;
      color: var(--gold);
      text-shadow:
        0 0 24px rgba(255, 224, 50, 0.85),
        0 0 48px rgba(255, 170, 0, 0.55),
        0 6px 14px rgba(0, 0, 0, 0.65);
      z-index: 22;
      white-space: nowrap;
    }

    #s2-rank-badge sup {
      font-size: 52px;
      vertical-align: super;
      margin-left: 2px;
    }

    #s2-area-counter-wrap {
      position: absolute;
      left: 1025px;
      top: 548px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 23;
      white-space: nowrap;
    }

    #s2-area-num {
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 82px;
      letter-spacing: -2px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 22px rgba(255, 230, 59, 0.9),
        0 0 45px rgba(255, 166, 0, 0.65),
        0 5px 14px rgba(0, 0, 0, 0.75);
    }

    #s2-area-unit {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 31px;
      line-height: 1.08;
      color: var(--gold);
      text-align: left;
      text-shadow:
        0 0 16px rgba(255, 230, 59, 0.85),
        0 4px 10px rgba(0, 0, 0, 0.75);
    }

    /* Scene 3: "14%" Screen-Space Counter below the 3D tilted world map card */
    #s3-screen-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 1180px;
      z-index: 30;
    }

    #s3-pct-num {
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 168px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      transform: rotate(-8deg);
      text-shadow:
        0 0 32px rgba(255, 230, 59, 0.92),
        0 0 70px rgba(255, 174, 0, 0.6),
        0 10px 24px rgba(0, 0, 0, 0.8);
    }

    /* Scene 4: 7 US Flag Map Cutouts inside the Indian Ocean (Map Space) */
    #s4-usa-layer {
      position: absolute;
      inset: 0;
      z-index: 24;
    }

    .usa-item {
      position: absolute;
      width: 156px;
      height: 98px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.65));
      will-change: transform, opacity, filter;
    }

    /* Scene 5: "1.5x" Counter over Glowing Asia (Map Space) */
    #s5-asia-counter {
      position: absolute;
      left: 1120px;
      top: 265px;
      transform: translate(-50%, -50%);
      font-family: var(--font-num);
      font-weight: 800;
      font-size: 96px;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      background: rgba(10, 18, 14, 0.86);
      border: 2.5px solid rgba(255, 230, 59, 0.78);
      border-radius: 26px;
      padding: 18px 46px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.78),
        0 0 30px rgba(255, 215, 0, 0.25),
        inset 0 0 18px rgba(255, 230, 59, 0.12);
      text-shadow:
        0 0 24px rgba(255, 230, 59, 0.92),
        0 0 52px rgba(255, 166, 0, 0.65),
        0 4px 12px rgba(0, 0, 0, 0.85);
      z-index: 26;
      white-space: nowrap;
    }

    /* Scene 6: Two Photorealistic Moons inside Indian Ocean (Map Space) */
    #s6-moons-layer {
      position: absolute;
      inset: 0;
      z-index: 25;
    }

    .moon-orb {
      position: absolute;
      width: 152px;
      height: 152px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      box-shadow:
        0 18px 32px rgba(0, 0, 0, 0.78),
        0 0 26px rgba(210, 230, 255, 0.28),
        inset -14px -14px 28px rgba(0, 0, 0, 0.55),
        inset 8px 8px 18px rgba(255, 255, 255, 0.25);
      will-change: transform, opacity;
    }

    .moon-orb img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* Subtle film grain (CSS radial-gradient per HyperFrames spec) */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      opacity: 0.14;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1.2px),
        radial-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1.2px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: overlay;
    }
    
  </style>
</head>

    tl.set("#s2-area-counter-wrap", { autoAlpha: 0, scale: 0.7 }, 0);
    tl.set("#s3-pct-num", { autoAlpha: 0, scale: 0.5 }, 0);
    tl.set(["#usa-1", "#usa-2", "#usa-3", "#usa-4", "#usa-5", "#usa-6", "#usa-7"], { autoAlpha: 0, scale: 0.3 }, 0);
    tl.set("#s5-asia-counter", { autoAlpha: 0, scale: 0.5 }, 0);
    tl.set(["#moon-left", "#moon-right"], { autoAlpha: 0, scale: 0.2 }, 0);

    // =========================================================================
    // SCENE 1 (0.0s - 5.0s): Whip-pan from Africa to Indian Ocean + "INDIAN OCEAN"
    // =========================================================================
    tl.fromTo(
      "#map-card",
      { x: 170, y: -30, scale: 2.55, rotationX: 6, rotationZ: 0 },
      { x: -529, y: -137, scale: 2.35, rotationX: 4, rotationZ: 0, duration: 2.1, ease: "expo.inOut" },
      0.15
    );

    // Subtle continuous drift during title hold (2.25s - 4.8s)
    tl.fromTo(
      "#map-card",
      { x: -529, y: -137, scale: 2.35 },
      { x: -545, y: -142, scale: 2.42, duration: 2.55, ease: "sine.inOut" },
      2.25
    );

    // Staggered 3D character pop-in for "INDIAN" then "OCEAN"
    var s1Chars = ["#c-i1", "#c-n1", "#c-d1", "#c-i2", "#c-a1", "#c-n2", "#c-o1", "#c-c1", "#c-e1", "#c-a2", "#c-n3"];
    tl.set(s1Chars, { autoAlpha: 0, y: 28, scale: 0.55 }, 0);
    s1Chars.forEach(function (sel, idx) {
      tl.fromTo(
        sel,
        { autoAlpha: 0, y: 28, scale: 0.55, rotationX: -45 },
        { autoAlpha: 1, y: 0, scale: 1, rotationX: 0, duration: 0.32, ease: "back.out(1.8)" },
        2.15 + idx * 0.08
      );
    });

    // Title exit as camera zooms out to full Indian Ocean basin at 4.7s
    tl.fromTo(
      "#s1-title-wrap",
      { autoAlpha: 1, scale: 1 },
      { autoAlpha: 0, scale: 0.75, duration: 0.3, ease: "power2.in" },
      4.7
    );

    // =========================================================================
    // SCENE 2 (5.0s - 11.2s): Indian Ocean Outline + "3rd" + "70.56 Million Sq. Kms"
    // =========================================================================
    // Camera zooms out to frame entire Indian Ocean basin (5.0s - 5.7s)
    tl.fromTo(
      "#map-card",
      { x: -545, y: -142, scale: 2.42, rotationX: 4, rotationZ: 0 },
      { x: -348, y: -143, scale: 1.62, rotationX: 10, rotationZ: 0, duration: 0.75, ease: "power3.inOut" },
      4.85
    );

    // Draw glowing yellow Indian Ocean perimeter line
    tl.fromTo(
      "#io-gold-outline",
      { autoAlpha: 0, strokeDashoffset: 3200 },
      { autoAlpha: 1, strokeDashoffset: 0, duration: 1.1, ease: "power2.out" },
      5.1
    );

    // Pop in "3rd" badge (5.5s - 7.3s)
    tl.fromTo(
      "#s2-rank-badge",
      { autoAlpha: 0, scale: 0.35, y: 20 },
      { autoAlpha: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" },
      5.45
    );
    tl.fromTo(
      "#s2-rank-badge",
      { autoAlpha: 1, scale: 1 },
      { autoAlpha: 0, scale: 1.35, duration: 0.28, ease: "power2.in" },
      7.25
    );

    // Reveal interior measurement grid + push camera in while counting to 70.56 Million Sq. Kms
    tl.fromTo(
      "#io-grid-fill-group",
      { autoAlpha: 0 },
      { autoAlpha: 1, duration: 0.45, ease: "power2.out" },
      7.4
    );

    tl.fromTo(
      "#map-card",
      { x: -348, y: -143, scale: 1.62, rotationX: 10 },
      { x: -429, y: -192, scale: 1.95, rotationX: 14, duration: 3.1, ease: "power2.inOut" },
      7.45
    );

    tl.fromTo(
      "#s2-area-counter-wrap",
      { autoAlpha: 0, scale: 0.65, y: 18 },
      { autoAlpha: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.5)" },
      7.5
    );

    var areaProxy = { val: 0 };
    tl.fromTo(
      areaProxy,
      { val: 0 },
      {
        val: 70.56,
        duration: 2.35,
        ease: "power2.out",
        onUpdate: function () {
          var el = document.getElementById("s2-area-num");
          if (el) el.textContent = areaProxy.val.toFixed(2);
        }
      },
      7.55
    );

    // Fade out Scene 2 overlays at 11.0s
    tl.fromTo(
      ["#s2-area-counter-wrap", "#io-gold-outline", "#io-grid-fill-group"],
      { autoAlpha: 1 },
      { autoAlpha: 0, duration: 0.25, ease: "power2.in" },
      10.95
    );

    // =========================================================================
    // SCENE 3 (11.2s - 15.0s): 3D Tilted World Map Card + "14%" of Earth's Surface
    // =========================================================================
    tl.fromTo(
      "#map-card",
      { x: -429, y: -192, scale: 1.95, rotationX: 14, rotationY: 0, rotationZ: 0 },
      { x: 0, y: -140, scale: 0.58, rotationX: 28, rotationY: 8, rotationZ: -15, duration: 0.85, ease: "expo.out" },
      11.15
    );

    tl.fromTo(
      "#bg-grid-stage",
      { rotationX: 18, rotationZ: -6, scale: 1.05 },
      { rotationX: 28, rotationZ: -15, scale: 1.18, duration: 3.6, ease: "sine.inOut" },
      11.15
    );

    tl.fromTo(
      "#io-emerald-highlight",
      { autoAlpha: 0 },
      { autoAlpha: 1, duration: 0.5, ease: "power2.out" },
      11.4
    );

    tl.fromTo(
      "#s3-pct-num",
      { autoAlpha: 0, scale: 0.45, y: 40 },
      { autoAlpha: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" },
      11.55
    );

    var pctProxy = { val: 0 };
    tl.fromTo(
      pctProxy,
      { val: 0 },
      {
        val: 14,
        duration: 1.65,
        ease: "power2.out",
        onUpdate: function () {
          var el = document.getElementById("s3-pct-num");
          if (el) el.textContent = Math.round(pctProxy.val) + "%";
        }
      },
      11.6
    );

    tl.fromTo(
      ["#s3-pct-num", "#io-emerald-highlight"],
      { autoAlpha: 1 },
      { autoAlpha: 0, duration: 0.25, ease: "power2.in" },
      14.75
    );

    // =========================================================================
    // SCENE 4 (15.0s - 20.0s): 7 Contiguous USA Flag Cutouts Inside Indian Ocean
    // =========================================================================
    tl.fromTo(
      "#map-card",
      { x: 0, y: -140, scale: 0.58, rotationX: 28, rotationY: 8, rotationZ: -15 },
      { x: -414, y: -176, scale: 1.88, rotationX: 4, rotationY: 0, rotationZ: 0, duration: 0.75, ease: "expo.inOut" },
      14.85
    );

    // First US cutout pops in large in upper-left Indian Ocean (15.5s), then settles into slot #1 (17.1s)
    tl.fromTo(
      "#usa-1",
      { autoAlpha: 0, x: 45, y: 25, scale: 2.15 },
      { autoAlpha: 1, x: 35, y: 15, scale: 1.55, duration: 0.45, ease: "back.out(1.6)" },
      15.55
    );
    tl.fromTo(
      "#usa-1",
      { x: 35, y: 15, scale: 1.55 },
      { x: 0, y: 0, scale: 1.0, duration: 0.4, ease: "power3.inOut" },
      17.0
    );

    // Remaining 6 US cutouts pop in rapidly across the basin (17.25s - 19.1s)
    var otherUsa = ["#usa-2", "#usa-3", "#usa-4", "#usa-5", "#usa-6", "#usa-7"];
    otherUsa.forEach(function (sel, idx) {
      tl.fromTo(
        sel,
        { autoAlpha: 0, x: -35, y: -15, scale: 0.35 },
        { autoAlpha: 1, x: 0, y: 0, scale: 1.0, duration: 0.32, ease: "back.out(1.7)" },
        17.15 + idx * 0.20
      );
    });

    // Hide all 7 US cutouts at 19.8s
    tl.fromTo(
      ["#usa-1", "#usa-2", "#usa-3", "#usa-4", "#usa-5", "#usa-6", "#usa-7"],
      { autoAlpha: 1, scale: 1.0 },
      { autoAlpha: 0, scale: 0.6, duration: 0.22, ease: "power2.in" },
      19.78
    );

    // =========================================================================
    // SCENE 5 (20.0s - 24.2s): "1.5x" The Size of Asia (Glowing Continent)
    // =========================================================================
    tl.fromTo(
      "#map-card",
      { x: -414, y: -176, scale: 1.88, rotationX: 4 },
      { x: -496, y: 254, scale: 1.48, rotationX: 12, duration: 0.75, ease: "power3.inOut" },
      19.95
    );

    tl.fromTo(
      "#asia-gold-region",
      { autoAlpha: 0 },
      { autoAlpha: 1, duration: 0.45, ease: "power2.out" },
      20.35
    );

    tl.fromTo(
      "#s5-asia-counter",
      { autoAlpha: 0, scale: 0.45, y: 20 },
      { autoAlpha: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
      20.45
    );

    var asiaProxy = { val: 0 };
    tl.fromTo(
      asiaProxy,
      { val: 0 },
      {
        val: 1.5,
        duration: 1.75,
        ease: "power2.out",
        onUpdate: function () {
          var el = document.getElementById("s5-asia-counter");
          if (el) {
            if (asiaProxy.val >= 1.48) {
              el.textContent = "1.5x";
            } else {
              el.textContent = asiaProxy.val.toFixed(2) + "x";
            }
          }
        }
      },
      20.5
    );

    // Subtle pull-back on Asia before panning back to Indian Ocean
    tl.fromTo(
      "#map-card",
      { x: -496, y: 254, scale: 1.48, rotationX: 12 },
      { x: -422, y: 200, scale: 1.32, rotationX: 8, duration: 1.1, ease: "sine.inOut" },
      22.8
    );

    tl.fromTo(
      ["#asia-gold-region", "#s5-asia-counter"],
      { autoAlpha: 1 },
      { autoAlpha: 0, duration: 0.28, ease: "power2.in" },
      23.9
    );

    // =========================================================================
    // SCENE 6 (24.2s - 28.0s): Surface Area Almost Double That of the Moon (2 Moons)
    // =========================================================================
    tl.fromTo(
      "#map-card",
      { x: -422, y: 200, scale: 1.32, rotationX: 8 },
      { x: -432, y: -170, scale: 1.92, rotationX: 4, duration: 0.85, ease: "power3.inOut" },
      24.2
    );

    tl.fromTo(
      "#moon-left",
      { autoAlpha: 0, scale: 0.15, rotation: -25 },
      { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1.7)" },
      25.15
    );

    tl.fromTo(
      "#moon-right",
      { autoAlpha: 0, scale: 0.15, rotation: 25 },
      { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1.7)" },
      25.55
    );

    // Subtle continuous orbital drift through the end of the 28s composition
    tl.fromTo(
      ["#moon-left", "#moon-right"],
      { y: 0 },
      { y: -8, duration: 1.9, ease: "sine.inOut" },
      26.1
    );

    // Register master timeline for HyperFrames deterministic frame-by-frame seeking
    var _origSeek = tl.seek.bind(tl);
    tl.seek = function (time, suppressEvents) {
      _origSeek(time, suppressEvents);
      var clips = document.querySelectorAll("#main .clip");
      for (var i = 0; i < clips.length; i++) {
        var c = clips[i];
        var st = parseFloat(c.getAttribute("data-start") || "0");
        var dur = parseFloat(c.getAttribute("data-duration") || "28");
        var active = time >= st && time <= st + dur;
        c.style.visibility = active ? "visible" : "hidden";
      }
      return tl;
    };
    window.__timelines["main"] = tl;
    (function () {
      var m = window.location.search.match(/[?&]t=([0-9.]+)/);
      if (m) {
        document.body.classList.add("hf-headless");
        tl.seek(parseFloat(m[1]), false);
      }
    })();
    
  </script>
</body>
</html>
